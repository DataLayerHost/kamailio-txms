#!KAMAILIO
# Export variables from .env.example in the service environment before startup.
# Run as the dedicated Kamailio user, e.g. kamailio -m 128 for shared memory.
log_stderror=yes
children=4
# Safe initial listener: replace with an interface restricted to your gateway.
listen=udp:127.0.0.1:5060
disable_tcp=yes
loadmodule "sl.so"
loadmodule "textops.so"
loadmodule "txms.so"
# 0 = bare TPDU, 1 = SMSC-prefixed PDU, 2 = RP-DATA (default).
modparam("txms", "sms_framing", 2)
request_route {
	# Replace this loopback-only policy with gateway authentication/IP filtering.
	if (src_ip != 127.0.0.1) {
		sl_send_reply("403", "Forbidden");
		exit;
	}
	if (is_method("MESSAGE")) {
		if (txms_process_and_submit()) {
			# Accepted into volatile shared memory; blockchain acceptance is asynchronous.
			sl_send_reply("200", "Accepted");
			exit;
		}
		sl_send_reply("503", "Not Accepted");
		exit;
	}
	sl_send_reply("405", "Method Not Allowed");
}
